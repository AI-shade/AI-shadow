# main에 push하면 버셀에 자동 배포한다.
#
# 버셀의 Git 연결은 무료(Hobby) 플랜에서 "비공개 조직(GitHub Organization) 저장소"를 받아주지 않는다.
# 그 제한은 Git 연결에만 걸리므로, 지금까지 손으로 하던 CLI 배포(vercel deploy --prod)를
# GitHub Actions가 대신 돌리게 한다. 버셀이 서버에서 빌드하는 방식이라 손으로 하던 것과 같다.
#
# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN        버셀 Account Settings → Tokens 에서 만든 토큰
#   VERCEL_ORG_ID       .vercel/project.json 의 orgId
#   VERCEL_PROJECT_ID   .vercel/project.json 의 projectId
# 셋 중 하나라도 비어 있으면 실패하지 않고 경고만 남기고 건너뛴다(Secrets를 넣기 전에 이 파일이
# 먼저 올라가도 push마다 빨간 불이 켜지지 않게).
# API 키(ANTHROPIC_API_KEY 등)는 여기가 아니라 버셀 프로젝트의 Environment Variables에 둔다.
#
# 토큰이 새 나가는 길을 좁혀 두었다(자동 보안 검토 지적 반영):
#   - VERCEL_TOKEN은 job 전체가 아니라 "확인"과 "배포" 두 단계에만 준다. 제3자 패키지를
#     내려받는 설치 단계(npm install)와 checkout·setup-node에는 토큰이 보이지 않는다.
#   - Vercel CLI는 버전을 못 박고(--ignore-scripts로 설치 스크립트도 막는다) 매번 최신을 받지 않는다.
#     올리고 싶으면 아래 숫자만 바꾸면 된다.
#   - main에서만 돈다. 다른 브랜치에서 수동 실행해도 배포 job이 건너뛰어진다.
# 남은 한계: 저장소 쓰기 권한이 있는 사람은 다른 브랜치에서 이 파일을 고쳐 돌려 Secrets를 읽을 수
# 있다(GitHub Secrets의 일반적인 성질). 작은 팀의 비공개 저장소라 받아들이고, 필요해지면 Admin이
# GitHub Environment(배포 브랜치를 main으로 제한)를 만들어 Secrets를 거기로 옮기면 막힌다.
name: Vercel 배포

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 손으로도 돌릴 수 있다 (처음 한 번 시험해 볼 때)

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Secrets 확인
        id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID 중 비어 있는 게 있어 배포를 건너뜁니다. Settings → Secrets and variables → Actions 에서 넣어 주세요."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: steps.check.outputs.ready == 'true'
        name: Vercel CLI 설치 (버전 고정)
        run: npm install --global --ignore-scripts vercel@62.1.0
      - if: steps.check.outputs.ready == 'true'
        name: 프로덕션 배포
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
