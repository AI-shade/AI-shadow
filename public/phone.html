<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>아이SHADOW 앱 목업</title>
<!-- 폰 목업(11-23 «핸드폰 목업화면 어플 가상으로 만들어줘»). 같은 주소의 실제 사이트를 폰 크기(390×844)로 띄운다 —
     따로 그린 그림이 아니라서 사이트를 고치면 목업도 같이 바뀐다. 주소 뒤에 ?p=#me 처럼 붙이면 그 화면으로 연다. -->
<style>
  :root { --ink: #131512; --green: #4a9a5c; --cream: #f0ead8; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--cream);
    font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  body { display: flex; align-items: center; justify-content: center; gap: 72px; overflow: hidden; }
  .copy { max-width: 360px; }
  .copy .eyebrow { color: var(--green); font-weight: 800; letter-spacing: 0.18em; font-size: 13px; margin: 0 0 18px; }
  .copy h1 { font-size: 44px; line-height: 1.2; margin: 0 0 18px; font-weight: 900; letter-spacing: -0.02em; }
  .copy p { font-size: 17px; line-height: 1.7; opacity: 0.85; margin: 0 0 26px; }
  .copy .url { color: var(--green); font-weight: 700; font-size: 15px; }
  /* 폰 — 바깥 몸체 · 화면 · 위 섬 · 옆 단추 */
  .stage { transform-origin: center; }
  .phone { position: relative; width: 390px; height: 844px; padding: 14px; background: #0b0c0b;
    border-radius: 62px; box-shadow: 0 0 0 2px #2c2f2b, 0 30px 80px rgba(0, 0, 0, 0.55); }
  .phone::before, .phone::after { content: ""; position: absolute; width: 4px; background: #2c2f2b; border-radius: 2px; }
  .phone::before { left: -6px; top: 180px; height: 64px; }
  .phone::after { right: -6px; top: 220px; height: 96px; }
  .screen { position: relative; width: 390px; height: 844px; border-radius: 48px; overflow: hidden; background: var(--ink); }
  .status { position: absolute; inset: 0 0 auto 0; height: 50px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 30px 0 36px; font-size: 16px; font-weight: 700; color: #fff; z-index: 2; pointer-events: none; background: var(--ink); }
  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; border-radius: 20px; background: #000; z-index: 3; }
  .icons { display: flex; gap: 6px; align-items: center; }
  .icons i { display: block; background: #fff; }
  .bars { display: flex; gap: 2px; align-items: flex-end; height: 12px; }
  .bars i { width: 3px; border-radius: 1px; }
  .batt { width: 24px; height: 12px; border: 1.5px solid #fff; border-radius: 4px; padding: 1.5px; box-sizing: border-box; }
  .batt i { height: 100%; width: 80%; border-radius: 1px; }
  iframe { position: absolute; top: 50px; left: 0; width: 390px; height: 794px; border: 0; background: var(--ink); }
  .home-bar { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.55); z-index: 2; pointer-events: none; }
  @media (max-width: 900px) { .copy { display: none; } }
</style>
</head>
<body>
  <div class="copy">
    <p class="eyebrow">CAMPUS AX-TON · 멋쟁이사자처럼</p>
    <h1>아이 사진, 올리기 전에 한 번 더</h1>
    <p>간판, 전화번호, 지번 같은 위치 단서와 교복, 명찰처럼 소속을 드러내는 것까지 찾아내고, 아이는 그대로 둔 채 위험한 부분만 지워 드려요.</p>
    <span class="url" id="url"></span>
  </div>
  <div class="stage" id="stage">
    <div class="phone">
      <div class="screen">
        <div class="island"></div>
        <div class="status">
          <span>9:41</span>
          <span class="icons">
            <span class="bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:9px"></i><i style="height:12px"></i></span>
            <span class="batt"><i></i></span>
          </span>
        </div>
        <iframe id="app" title="아이SHADOW 앱 화면"></iframe>
        <div class="home-bar"></div>
      </div>
    </div>
  </div>
<script>
  // 같은 주소의 사이트를 띄운다. ?p=#me 처럼 주면 그 화면으로.
  var p = new URLSearchParams(location.search).get('p') || '';
  var app = document.getElementById('app');
  app.src = '/' + p;
  // 앱처럼 보이게 스크롤 막대를 숨긴다(같은 주소라 안쪽 문서에 손댈 수 있다)
  app.addEventListener('load', function () {
    try {
      var s = app.contentDocument.createElement('style');
      s.textContent = 'html{scrollbar-width:none}html::-webkit-scrollbar{display:none}';
      app.contentDocument.head.appendChild(s);
    } catch (e) { /* 다른 주소면 그대로 */ }
  });
  document.getElementById('url').textContent = location.host;
  // 창 높이에 맞춰 폰을 줄인다(키 900px 미만 창에서 잘리지 않게)
  function fit() { var s = Math.min(1, (innerHeight - 40) / 872); document.getElementById('stage').style.transform = 'scale(' + s + ')'; }
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
